name: Bug Report
description: Report a reproducible bug in SimpleSlateStyler
title: "[Bug] <Area> - <Short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Title format

        `[Bug] <Area> - <Short description>`

        Example: `[Bug] Parser - fails on empty entry block`

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the plugin does this affect?
      options:
        - DSL Parser
        - Brush Registry
        - Subsystem API
        - Scope Isolation
        - Build
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: One or two sentences summarizing the bug.
      placeholder: Describe the bug in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: UE version, plugin version/commit, OS, target platform.
      placeholder: |
        - Unreal Engine: 5.8.1
        - Plugin: 0.1.0 / commit abc1234
        - OS: Windows 11 23H2
        - Target: Win64 / Development
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Create Plugins/MyPlugin/Config/SimpleSlateStyler/ui.SimpleSlateStyler
        2. Add: MyPlugin.PanelBg { Resource = /Game/UI/M_PanelBg }
        3. Open the editor and run SimpleSlateStyler.Dump
    validations:
      required: true

  - type: textarea
    id: effect
    attributes:
      label: Effect
      description: What actually happens, and what did you expect instead?
      placeholder: |
        Observed: The entry is not registered, Dump shows 0 styles.
        Expected: MyPlugin.PanelBg is listed.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Log output, callstacks, workarounds, anything else.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have tested that this issue is reproducible on my setup.
          required: true